# prefix
set -g prefix C-t

# ターミナル設定 (Ghostty)
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-ghostty:RGB"
set -ag terminal-features ",xterm-ghostty:hyperlinks"
set -ag terminal-features ",xterm-ghostty:usstyle"
set -ag terminal-features ",xterm-ghostty:focus"

set -g mouse on

# フォーカスイベントを転送 (Neovim の autoread 等)
set -g focus-events on

# escapeを押したあとの待ち時間なし (vimが使いづらい)
set -s escape-time 0

# スクロールバッファ
set -g history-limit 50000

# ウィンドウ・ペインを 1 始まりに
set -g base-index 1
set -g pane-base-index 1

# ウィンドウ閉鎖後に番号を詰める
set -g renumber-windows on

# C-t t のpane表示時間
set -g display-panes-time 5000

# copy mode
set-window-option -g mode-keys vi

# vi コピーモード + pbcopy 連携
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Vimのキーバインドでペインを移動する
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# 分割を現在のディレクトリで開く
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# 設定リロード
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# ウィンドウリストの色
setw -g window-status-style fg=white,bg=default,dim

# アクティブウィンドウの色
setw -g window-status-current-style fg=yellow,bold,bg=default

# ペイン枠線
set -g pane-border-style 'fg=#444444'

# アクティブペイン枠線
set -g pane-active-border-style 'fg=yellow'

# コマンドラインの色
set -g message-style fg=white,bg=black,dim

# ステータスバー 無色
set -g status-style bg=default

# ステータスバー中身
set -g status-right ""
set -g status-left "#S "

# コピーモードのハイライト
set -g mode-style "fg=default,bg=default,reverse"
